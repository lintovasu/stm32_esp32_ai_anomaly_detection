name: Firmware Release

# Triggers three ways:
#  1. Push a version tag (git tag v1.4.0 && git push --tags) -- the real
#     release path. Builds both slots + bootloader and publishes a
#     GitHub Release with all artifacts attached.
#  2. Any ordinary push to main -- runs the SAME build (catches breakage
#     on every commit, "does it still compile") but does NOT publish a
#     release. This is what makes it "automatic" without you doing
#     anything beyond your normal git push.
#  3. Manual run from the Actions tab (workflow_dispatch) -- for testing
#     with an arbitrary version string, also does not publish a release.
on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to build (no v prefix), e.g. 1.4.0-test'
        required: true
        default: '0.0.0-test'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # if your STM32Cube Drivers/ dir is a submodule

      - name: Extract version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Ordinary push to main -- not a real release, so use a
            # dev-tagged version built from the short commit SHA so
            # build artifacts are traceable back to the exact commit.
            echo "version=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Verify toolchain
        run: arm-none-eabi-gcc --version

      # --- Bootloader ---
      # Built and size-checked on every release as a regression check
      # (catches "someone added code that no longer fits in 32KB")
      # even though you normally don't re-flash the bootloader itself
      # per release.
      - name: Build bootloader
       # run: make -f ci/Makefile.bootloader

      # --- Application, both slots ---
      - name: Build application (Slot A)
        run: make -f ci/Makefile.app SLOT=A VERSION=${{ steps.ver.outputs.version }}

      - name: Build application (Slot B)
        run: make -f ci/Makefile.app SLOT=B VERSION=${{ steps.ver.outputs.version }}

      # --- Manifest with SHA-256 for both slot binaries ---
      - name: Generate manifest.json
        run: |
          python3 ci/scripts/generate_manifest.py \
            --version "${{ steps.ver.outputs.version }}" \
            --slotA "build/app_slotA/firmware_v${{ steps.ver.outputs.version }}_slotA.bin" \
            --slotB "build/app_slotB/firmware_v${{ steps.ver.outputs.version }}_slotB.bin" \
            --notes "${{ github.event.head_commit.message }}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            --out manifest.json

      # --- Basic sanity gate before anything gets published ---
      # Fails the whole workflow (no release created) if either binary
      # is missing, empty, or manifest generation produced something
      # unparsable -- cheap insurance against silently shipping a
      # zero-byte or half-written artifact.
      - name: Sanity check artifacts
        run: |
          set -e
          for f in \
            "build/app_slotA/firmware_v${{ steps.ver.outputs.version }}_slotA.bin" \
            "build/app_slotB/firmware_v${{ steps.ver.outputs.version }}_slotB.bin" \
            manifest.json; do
            [ -s "$f" ] || { echo "ERROR: $f missing or empty"; exit 1; }
          done
          python3 -c "import json; json.load(open('manifest.json'))"

      - name: Upload build artifacts (always, even on test runs)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-v${{ steps.ver.outputs.version }}
          path: |
            build/app_slotA/firmware_v${{ steps.ver.outputs.version }}_slotA.bin
            build/app_slotB/firmware_v${{ steps.ver.outputs.version }}_slotB.bin
            build/bootloader/bootloader.bin
            manifest.json
          retention-days: 14

      - name: Publish GitHub Release with artifacts
        if: startsWith(github.ref, 'refs/tags/')   # only real version tags cut a release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app_slotA/firmware_v${{ steps.ver.outputs.version }}_slotA.bin
            build/app_slotB/firmware_v${{ steps.ver.outputs.version }}_slotB.bin
            build/bootloader/bootloader.bin
            manifest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Optional: notify your MQTT broker / trigger fleet rollout ---
      # Left commented out since it depends on how you want rollout to
      # work (all devices at once vs staged). Uncomment and point at
      # your broker once you're ready to have releases auto-publish an
      # "update available" MQTT message instead of triggering it by hand.
      #
      # - name: Publish update-available MQTT message
      #   run: |
      #     python3 ci/scripts/notify_mqtt.py \
      #       --manifest-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/manifest.json"
